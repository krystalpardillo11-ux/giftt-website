<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Open for a Present</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: radial-gradient(circle, #40bb88, #0f2a20);
      font-family: 'Arial', sans-serif;
      overflow: hidden;
      margin: 0;
    }

    .container {
      text-align: center;
    }

   
    .open-button {
      padding: 20px 50px;
      font-size: 20px;
      background-color: #fd2d2d; 
      border: none;
      border-radius: 12px;
      cursor: pointer;
      color: #fff;
      transition: background-color 0.3s ease;
    }

    .open-button:hover {
      background-color: #610707; 
    }

    
    .emoji-container {
      opacity: 0;
      transform: translateY(20px) scale(0.5);
      transition: opacity 1s ease-out, transform 1s ease-out;
      font-size: 70px;
      color: #ffde00;
      padding-top: 20px;
    }

   
    .emoji-container.active {
      opacity: 1;
      transform: translateY(-20px) scale(1);
    }

  </style>
</head>
<body>

  <div class="container">
    <button class="open-button" onclick="openPresent()">Open for a present</button>
    <div class="emoji-container">
      <span class="emoji">🖕🤞</span>
    </div>
  </div>

  <script>
    function openPresent() {
     
      document.querySelector('.emoji-container').classList.add('active');
    }
  </script>

</body>
</html>
